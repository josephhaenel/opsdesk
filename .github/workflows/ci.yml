name: OpsDesk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opsdesk_test
          POSTGRES_USER: opsdesk_test
          POSTGRES_PASSWORD: isolated-ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U opsdesk_test -d opsdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PYTHONPATH: apps/api
      TEST_DATABASE_URL: postgresql+psycopg://opsdesk_test:isolated-ci-test-only@localhost:5432/opsdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff format --check apps/api/opsdesk
      - run: ruff check apps/api/opsdesk
      - run: python -m pytest tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
